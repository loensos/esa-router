# ESA Router v1.2 配置示例

# 监听端口
listen_port = 7825

# 路由列表
[routers]
# 静态路由
"/ws-us" = "127.0.0.1:2000"
"/ws-sg" = "127.0.0.1:2001"

# 动态路由 - 端口提取
# /node-2001 -> 127.0.0.1:2001
"/node-*" = "127.0.0.1:<port>"

# 动态路由 - 范围匹配
# /node-2001 到 /node-3000 -> 127.0.0.1:2001-3000
"/node-2001-3000" = "127.0.0.1:<port>"
